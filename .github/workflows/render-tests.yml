name: Renderer regression tests
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'resources/shaders/**', '.github/workflows/render-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dri
      - name: Rendering, state and lifecycle regressions
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          python3 tests/run_ios_atlas_tests.py
          python3 tests/run_ios_state_tests.py
          python3 tests/run_ios_active_tests.py
          python3 tests/run_ios_lifecycle_tests.py
          python3 tests/run_ios_upload_tests.py
          python3 tests/run_ios_geometry_tests.py
          python3 tests/run_ios_shader_tests.py
