name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-15-intel

        - name: iOS
          os: macos-15-intel
          target: iOS

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          # Same Geode version as mod.json.
          sdk: v5.11.2

  # Rendering core tests on Mesa (llvmpipe OpenGL + lavapipe Vulkan): every
  # backend / culling combination must render the same image. Also checks that
  # the committed shader binaries match shaders/*.sc.
  core-tests:
    name: Rendering core tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgl-dev libegl-dev libx11-dev \
            mesa-vulkan-drivers libgl1-mesa-dri xvfb

      - name: Cache shaderc
        uses: actions/cache@v4
        with:
          path: build-shaderc
          key: shaderc-${{ hashFiles('tools/build_shaderc.sh') }}

      - name: Check generated shaders
        run: tools/build_shaderc.sh --check

      - name: Build tests
        run: |
          cmake -S tests -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-tests

      - name: Run tests
        run: |
          ./build-tests/bismuth_kernel_test
          xvfb-run -a ./build-tests/bismuth_render_test

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
