name: Build iOS Geode Mod

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'resources/shaders/**'
      - 'CMakeLists.txt'
      - 'mod.json'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  build-ios:
    name: iOS
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: Bismuth-iOS
          path: ${{ steps.build.outputs.build-output }}
