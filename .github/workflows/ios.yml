name: Build Kyanite iOS Port

on:
  workflow_dispatch:
  push:
    branches:
      - kyanite-port
    paths:
      - 'src/ios/**'
      - 'src/renderer/ios/**'
      - 'CMakeLists.txt'
      - 'mod.json'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  build-ios:
    name: Geometry Dash 2.2091 / Geode 6.0.0 / iOS
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Build iOS mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS

      - name: Upload iOS .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kyanite-iOS-Geode
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 30
